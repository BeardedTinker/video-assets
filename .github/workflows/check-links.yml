name: Check Links

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200..=299,403,429
            --max-redirects 20
            --exclude '^https://wazuh\.example\.internal'
            './**/*.md'
