name: Validate YAML

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate tracked YAML
        shell: bash
        run: |
          git ls-files -z -- '*.yaml' '*.yml' \
            | xargs -0 --no-run-if-empty docker run --rm \
                -v "$GITHUB_WORKSPACE:/workdir" \
                -w /workdir \
                mikefarah/yq:4.47.2 eval '.' >/dev/null

      - name: Validate Wazuh embedded JSON
        shell: bash
        run: bash smart-home-siem-wazuh/scripts/validate-embedded-json.sh
