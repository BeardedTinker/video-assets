###############################################################################
# Rain Tank — Low Water Cutoff + Level Alerts
#
# - If tank is critically low and pump is ON -> force OFF
# - Sends low/high water alerts unless sleep mode is enabled
#
# Entities used:
# - sensor.rain_tank_level_liquid_depth (cm)
# - switch.water_pump
# - input_boolean.sleep_mode
# - notify.mobile_app_pixel_9_pro_xl
###############################################################################

- id: protection_rain_tank_low_water_cutoff
  alias: "Protection — Rain Tank Low Water Cutoff"
  description: "Prevents pump operation when rain tank level is too low."
  mode: parallel

  trigger:
    - trigger: numeric_state
      entity_id: sensor.rain_tank_level_liquid_depth
      below: 20
      id: hard_cutoff
    - trigger: numeric_state
      entity_id: sensor.rain_tank_level_liquid_depth
      below: 30
      id: low_level
    - trigger: numeric_state
      entity_id: sensor.rain_tank_level_liquid_depth
      above: 160
      id: high_level
    - trigger: state
      entity_id: switch.water_pump
      to: "on"
      id: pump_turned_on

  action:
    - variables:
        level: "{{ states('sensor.rain_tank_level_liquid_depth') }}"
        pump_was_on: "{{ is_state('switch.water_pump', 'on') }}"

    - choose:
        # Hard cutoff is never disabled by sleep mode or notification settings.
        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: hard_cutoff
                - condition: and
                  conditions:
                    - condition: trigger
                      id: pump_turned_on
                    - condition: numeric_state
                      entity_id: sensor.rain_tank_level_liquid_depth
                      below: 20
          sequence:
            - if:
                - condition: state
                  entity_id: switch.water_pump
                  state: "on"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: switch.water_pump

            - if:
                - condition: state
                  entity_id: input_boolean.sleep_mode
                  state: "off"
              then:
                - action: notify.mobile_app_pixel_9_pro_xl
                  data:
                    title: "🚫 Rain Tank Critical Low Water"
                    message: >-
                      Water is critically low ({{ level }} cm).
                      Pump {{ 'forced OFF' if pump_was_on else 'remains blocked' }}.

        # Low level warning
        - conditions:
            - condition: trigger
              id: low_level
            - condition: numeric_state
              entity_id: sensor.rain_tank_level_liquid_depth
              above: 20
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.sleep_mode
                  state: "off"
              then:
                - action: notify.mobile_app_pixel_9_pro_xl
                  data:
                    title: "⚠️ Rain Tank Low Level"
                    message: "Water level low ({{ level }} cm)."

        # High level info
        - conditions:
            - condition: trigger
              id: high_level
          sequence:
            - if:
                - condition: state
                  entity_id: input_boolean.sleep_mode
                  state: "off"
              then:
                - action: notify.mobile_app_pixel_9_pro_xl
                  data:
                    title: "💧 Rain Tank Almost Full"
                    message: "Water level high ({{ level }} cm)."
