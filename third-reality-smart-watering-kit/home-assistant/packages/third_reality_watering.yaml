################################################################################
# Third Reality Smart Watering (ZHA) — HA 2026.1+
#
# Entities (expected):
#  - sensor.basil_humidity            (% soil moisture)
#  - sensor.basil_temperature         (°C, optional)
#  - sensor.basic_battery             (% soil sensor battery)
#  - switch.water_pump
#  - input_number.water_pump_duration (seconds)
#  - input_number.water_pump_interval (days)
#  - input_datetime.water_pump_last_run
#  - sensor.water_pump_battery        (% pump battery)
################################################################################

input_boolean:
  watering_enabled:
    name: Watering enabled
    icon: mdi:water-pump

input_number:
  basil_moisture_low:
    name: Basil moisture LOW threshold
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    initial: 18

  basil_moisture_target:
    name: Basil moisture TARGET
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    initial: 28

  water_pump_duration:
    name: Water pump duration
    min: 1
    max: 120
    step: 1
    unit_of_measurement: s
    initial: 20

  water_pump_interval:
    name: Water pump interval
    min: 1
    max: 30
    step: 1
    unit_of_measurement: d
    initial: 1

input_datetime:
  water_pump_last_run:
    name: Water pump last run
    has_date: true
    has_time: true

################################################################################
# Script: run pump for X seconds (failsafe built-in)
################################################################################
script:
  water_pump_run_safe:
    alias: Water Pump — Run (safe)
    mode: single
    fields:
      seconds:
        description: "How long to run the pump (seconds)"
        example: 20
    variables:
      requested_secs: >-
        {{ seconds
           | default(states('input_number.water_pump_duration'))
           | int(0) }}
      safe_secs: "{{ [requested_secs | int(0), 120] | min }}"
    sequence:
      - condition: state
        entity_id: input_boolean.watering_enabled
        state: "on"

      - condition: template
        value_template: "{{ requested_secs | int(0) >= 1 }}"

      - action: switch.turn_on
        continue_on_error: true
        target:
          entity_id: switch.water_pump

      - wait_template: "{{ is_state('switch.water_pump', 'on') }}"
        timeout:
          seconds: 10
        continue_on_timeout: true

      - if:
          - condition: state
            entity_id: switch.water_pump
            state: "on"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.water_pump_last_run
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

          - delay:
              seconds: "{{ safe_secs }}"

      - action: switch.turn_off
        target:
          entity_id: switch.water_pump

################################################################################
# Automations
################################################################################
automation:
  # 1) Interval-based watering (simple scheduler)
  - id: bt_watering_interval_schedule
    alias: Basil — Watering (interval schedule)
    mode: single
    triggers:
      - trigger: time
        at: "10:00:00"

    conditions:
      - condition: state
        entity_id: input_boolean.watering_enabled
        state: "on"

      - condition: template
        value_template: >-
          {% set last = as_timestamp(states('input_datetime.water_pump_last_run'), 0) %}
          {% set days = states('input_number.water_pump_interval') | int(1) %}
          {{ last == 0 or now().timestamp() - last >= days * 86400 }}

    actions:
      - action: script.water_pump_run_safe
        data:
          seconds: "{{ states('input_number.water_pump_duration') | int(20) }}"

  # 2) Soil moisture smart watering
  - id: bt_watering_when_soil_low
    alias: Basil — Watering (soil moisture smart trigger)
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {% set m = states('sensor.basil_humidity') | float(-1) %}
          {% set low = states('input_number.basil_moisture_low') | float(0) %}
          {{ m >= 0 and m < low }}
        for:
          minutes: 10

    conditions:
      - condition: state
        entity_id: input_boolean.watering_enabled
        state: "on"

      - condition: time
        after: "08:00:00"
        before: "21:00:00"

      - condition: template
        value_template: >-
          {% set last = as_timestamp(states('input_datetime.water_pump_last_run'), 0) %}
          {% set days = states('input_number.water_pump_interval') | int(1) %}
          {{ last == 0 or now().timestamp() - last >= days * 86400 }}

      - condition: template
        value_template: >-
          {% set m = states('sensor.basil_humidity') | float(-1) %}
          {% set target = states('input_number.basil_moisture_target') | float(0) %}
          {{ m >= 0 and m < target }}

    actions:
      - action: logbook.log
        data:
          name: "Watering"
          message: >-
            Soil low ({{ states('sensor.basil_humidity') }}%). Watering for
            {{ states('input_number.water_pump_duration') }}s.

      - action: script.water_pump_run_safe
        data:
          seconds: "{{ states('input_number.water_pump_duration') | int(20) }}"

      - delay:
          minutes: 20

      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set m = states('sensor.basil_humidity') | float(-1) %}
                  {% set low = states('input_number.basil_moisture_low') | float(0) %}
                  {{ m >= 0 and m < low }}
            sequence:
              - action: notify.telegram_ebrzsmbrbot
                data:
                  message: >-
                    ⚠️ Basil still reads very dry after watering.
                    Check the water bucket, tubing position, and filter.

  # 3) Pump failsafe
  - id: bt_watering_pump_failsafe_off
    alias: Basil — Pump failsafe (force off after 130s)
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: state
        entity_id: switch.water_pump
        to: "on"
        for:
          seconds: 130
        id: runtime
    actions:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.water_pump

      - if:
          - condition: trigger
            id: startup
        then:
          - wait_template: >-
              {{ states('switch.water_pump') not in ['unknown', 'unavailable'] }}

          - if:
              - condition: state
                entity_id: switch.water_pump
                state: "on"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.water_pump

      - if:
          - condition: trigger
            id: runtime
        then:
          - action: notify.telegram_ebrzsmbrbot
            data:
              message: "🛑 Failsafe: water_pump was ON for 130 seconds — turned OFF."

  # 4) Battery alerts (anti-spam)
  - id: bt_basil_soil_sensor_low_battery
    alias: Basil — Soil sensor low battery
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.basic_battery
        below: 15
    conditions:
      - condition: template
        value_template: >-
          {% set last = this.attributes.last_triggered %}
          {{ last is none or (now() - last).total_seconds() > 86400 }}
    actions:
      - action: notify.telegram_ebrzsmbrbot
        data:
          message: "🔋 Basil soil sensor battery low ({{ states('sensor.basic_battery') }}%)."

  - id: bt_basil_pump_low_battery
    alias: Basil — Water pump low battery
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.water_pump_battery
        below: 20
    conditions:
      - condition: template
        value_template: >-
          {% set last = this.attributes.last_triggered %}
          {{ last is none or (now() - last).total_seconds() > 86400 }}
    actions:
      - action: notify.telegram_ebrzsmbrbot
        data:
          message: "🔋 Water pump battery low ({{ states('sensor.water_pump_battery') }}%)."

  # 5) Health check — sensor unavailable
  - id: bt_basil_soil_sensor_unavailable
    alias: Basil — Soil sensor unavailable
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.basil_humidity
        to: "unavailable"
        for:
          minutes: 10
    conditions:
      - condition: template
        value_template: >-
          {% set last = this.attributes.last_triggered %}
          {{ last is none or (now() - last).total_seconds() > 43200 }}
    actions:
      - action: notify.telegram_ebrzsmbrbot
        data:
          message: "⚠️ Basil soil sensor is unavailable for 10+ minutes. Check Zigbee mesh / battery."
