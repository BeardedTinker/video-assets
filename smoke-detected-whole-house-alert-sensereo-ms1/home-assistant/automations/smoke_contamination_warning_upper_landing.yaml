- id: bt_smoke_contamination_warning_upper_landing
  alias: "Smoke Detector – Contamination Warning (Upper Landing)"
  description: "Warn when contamination state is not normal"
  mode: single

  variables:
    contamination_entity: sensor.upper_landing_smoke_contamination_state
    notify_telegram: notify.telegram_ebrzsmbrbot
    ok_state: "normal"

  triggers:
    - trigger: state
      entity_id: sensor.upper_landing_smoke_contamination_state

  conditions:
    - condition: template
      value_template: >
        {{ trigger.to_state is not none
           and trigger.to_state.state not in [ok_state, 'unknown', 'unavailable'] }}

  actions:
    - action: notify.send_message
      target:
        entity_id: "{{ notify_telegram }}"
      data:
        message: >-
          🧹 Smoke detector (Upper Landing) contamination detected: {{ trigger.to_state.state }}
