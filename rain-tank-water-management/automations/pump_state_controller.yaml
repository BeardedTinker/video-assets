alias: Rain Tank - Pump State Controller
description: >-
  Off-only safety interlock. Pump demand controls the pump directly; this
  automation only stops it when permission is not explicitly on.

triggers:
  - entity_id: binary_sensor.rain_tank_pump_allowed
    trigger: state

  - entity_id: switch.water_pump
    to: "on"
    trigger: state

  - event: start
    trigger: homeassistant

conditions:
  - condition: template
    value_template: >-
      {{ states('binary_sensor.rain_tank_pump_allowed') != 'on' }}

actions:
  - action: switch.turn_off
    target:
      entity_id: switch.water_pump

mode: restart
